<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주누디자인 통합 고객 검색 프로그램</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Malgun Gothic', sans-serif;
            padding: 20px;
        }
        .header {
            background-color: #343a40;
            color: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        .search-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .table-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow-x: auto;
            max-height: 70vh;
        }
        table th {
            background-color: #e9ecef !important;
            white-space: nowrap;
            position: sticky;
            top: 0;
            z-index: 1;
        }
        table td {
            vertical-align: middle;
            white-space: nowrap;
        }
        .badge-year {
            background-color: #6c757d;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="header">
        <h1>📊 주누디자인 고객 검색 프로그램</h1>
        <p>전체 연도 실시간 연동 · 향후 추가되는 새 시트(탭) 자동 통합 검색</p>
    </div>

    <div class="search-container">
        <div class="row align-items-center">
            <div class="col-md-8">
                <input type="text" id="searchInput" class="form-control form-control-lg" placeholder="🔍 검색어를 입력하세요 (예: 홍길동, 010-1234-5678, 디엠텍스)..." disabled>
            </div>
            <div class="col-md-4 text-end mt-3 mt-md-0">
                <span id="statusBadge" class="badge bg-warning text-dark p-2">전체 연도 데이터 불러오는 중...</span>
                <button id="refreshBtn" class="btn btn-outline-secondary btn-sm ms-2" onclick="loadData()">🔄 새로고침</button>
            </div>
        </div>
    </div>

    <div class="table-container">
        <table class="table table-hover table-bordered" id="customerTable">
            <thead>
                <tr id="tableHeader">
                    <!-- 헤더 자동 생성 -->
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- 데이터 자동 생성 -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // =========================================================================
    // [중요] 1단계에서 새 버전으로 배포하고 복사한 '웹 앱 URL'을 넣어주세요!
    // =========================================================================
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzOVRkVvJH0c5sv7zQcH9fX1qh1-JRQHMUpf-k90cIt_h-qu3ln2HPpSNrUVlO5swVG/exec';

    let customers = [];
    let headers = [];

    function renderTable(data) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        
        data.forEach(customer => {
            const tr = document.createElement('tr');
            const yearTd = document.createElement('td');
            yearTd.innerHTML = `<span class="badge badge-year">${customer._sheetName || '-'}</span>`;
            tr.appendChild(yearTd);

            headers.forEach(header => {
                const td = document.createElement('td');
                td.textContent = customer[header] || '';
                tr.appendChild(td);
            });
            tbody.appendChild(tr);
        });

        const statusBadge = document.getElementById('statusBadge');
        statusBadge.className = 'badge bg-success p-2';
        statusBadge.textContent = `검색 결과: 총 ${data.length}건 (모든 연도 연동 완료)`;
    }

    async function loadData() {
        const statusBadge = document.getElementById('statusBadge');
        const searchInput = document.getElementById('searchInput');
        
        statusBadge.className = 'badge bg-warning text-dark p-2';
        statusBadge.textContent = '구글 시트 전체 탭 동기화 중...';
        searchInput.disabled = true;

        try {
            // 인터넷 접속 및 CORS 우회를 위한 설정
            const response = await fetch(WEB_APP_URL, {
                method: 'GET',
                mode: 'cors',
                redirect: 'follow'
            });

            if (!response.ok) {
                throw new Error(`서버 응답 오류 (상태코드: ${response.status})`);
            }

            const result = await response.json();

            // 스크립트 쪽에서 에러 메시지를 넘겨주면 표시
            if (result.status === "error") {
                throw new Error(`스크립트 오류: ${result.message}`);
            }

            headers = result.headers;
            customers = result.data;

            const thead = document.getElementById('tableHeader');
            thead.innerHTML = '<th>연도(시트)</th>';
            headers.forEach(header => {
                const th = document.createElement('th');
                th.textContent = header;
                thead.appendChild(th);
            });

            renderTable(customers);
            searchInput.disabled = false;
            searchInput.placeholder = "🔍 검색어를 입력하세요 (고객명, 연락처, 상호, 연도 등)...";
            searchInput.focus();

        } catch (error) {
            console.error('Data Load Error:', error);
            statusBadge.className = 'badge bg-danger p-2';
            statusBadge.textContent = '연동 실패! (콘솔창 에러 확인)';
            
            // 왜 안 되는지 사용자 화면에 바로 알려주는 친절한 경고창
            alert(
                "❌ 구글 시트 데이터를 가져오지 못했습니다.\n\n" +
                "[원인 안내]\n" +
                "1. Apps Script에서 권한을 '모든 사용자'로 설정하셨나요?\n" +
                "2. 코드 수정 후 반드시 '새 버전'으로 배포하셔야 합니다.\n" +
                "3. 로컬 파일(file://)이 아닌 깃허브 페이지(https://) 주소에서 접속하셨나요?\n\n" +
                `상세 오류 메세지: ${error.message}`
            );
        }
    }

    document.getElementById('searchInput').addEventListener('keyup', function() {
        const searchTerm = this.value.toLowerCase();
        const filteredData = customers.filter(customer => {
            return Object.values(customer).some(val => 
                String(val).toLowerCase().includes(searchTerm)
            );
        });
        renderTable(filteredData);
    });

    window.addEventListener('DOMContentLoaded', loadData);
</script>
</body>
</html>
